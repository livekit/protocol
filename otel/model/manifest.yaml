file_format: definition_manifest/2.0
# A placeholder: Weaver requires a schema_url with a version segment. Producers do not emit it,
# and it does not change when the model changes (see otel/README.md, Versioning).
schema_url: https://livekit.io/schemas/telemetry/0.0.0
stability: development
description: LiveKit telemetry semantic conventions (shared identity, PII, SDK identity, client-owned and agents-owned signals).
dependencies:
  - schema_url: https://opentelemetry.io/schemas/1.44.0
    registry_path: https://github.com/open-telemetry/semantic-conventions.git@v1.44.0[model]
  # The OTel GenAI conventions moved out of the main semconv repo (which keeps only deprecated
  # gen-ai groups); this is the registry Agents' `gen_ai.*` keys are referenced from. It has no
  # tags, so it is pinned by commit. It depends on semconv v1.44.0 itself, the same as above.
  - schema_url: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
    registry_path: https://github.com/open-telemetry/semantic-conventions-genai.git@547934afa90a34298441caf80c43b27255c3a292[model]
