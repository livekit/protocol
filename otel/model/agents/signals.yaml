  # --- Rust Node binding -------------------------------------------------------------------
  - id: span.metrics
    type: span
    span_kind: internal
    stability: development
    brief: A plugin-task metric noted through the Node binding, stamped with its resolved frame.
    attributes:
      - ref: lk.metric
        requirement_level: required
      - ref: lk.frame.resolution
        requirement_level: required
      - ref: lk.speech_id
        requirement_level: {conditionally_required: When the frame resolves to a speech.}
  - id: span.tts_synthesize
    type: span
    span_kind: internal
    stability: development
    brief: The Node binding driving `Tts::synthesize` (the simplex path).
    attributes:
      - ref: lk.tts.label
        requirement_level: required
      - ref: lk.tts.streaming
        requirement_level: required
      - ref: lk.tts.frames
        requirement_level: {conditionally_required: On success.}
      - ref: lk.tts.bytes
        requirement_level: {conditionally_required: On success.}
      - ref: lk.error.retryable
        requirement_level: {conditionally_required: On failure.}
  - id: span.tts_stream
    type: span
    span_kind: internal
    stability: development
    brief: The Node binding driving `Tts::stream` (the duplex path).
    attributes:
      - ref: lk.tts.label
        requirement_level: required
      - ref: lk.tts.no_duplex_path
        requirement_level: {conditionally_required: When the instance has no duplex path.}
      - ref: lk.tts.frames
        requirement_level: {conditionally_required: On success.}
      - ref: lk.tts.bytes
        requirement_level: {conditionally_required: On success.}
      - ref: lk.error.retryable
        requirement_level: {conditionally_required: On failure.}

  # --- Metrics (`otel_metrics.py`, `metrics/otel.rs`) --------------------------------------
  # Units are exactly what the producer ships: the nine counters Python creates without a unit
  # are declared with `unit: ""` (the OTel SDK default), not with the `{token}` / `{character}`
  # / `{request}` annotations they arguably deserve; changing that is a wire change.
  - {id: metric.lk.agents.turn.e2e_latency, type: metric, metric_name: lk.agents.turn.e2e_latency, instrument: histogram, unit: s, stability: development, brief: "End-to-end latency of a turn.", attributes: [{ref: model_name, requirement_level: recommended}, {ref: model_provider, requirement_level: recommended}]}
  - {id: metric.lk.agents.turn.llm_ttft, type: metric, metric_name: lk.agents.turn.llm_ttft, instrument: histogram, unit: s, stability: development, brief: "Time to the first LLM token.", attributes: [{ref: model_name, requirement_level: recommended}, {ref: model_provider, requirement_level: recommended}]}
  - {id: metric.lk.agents.turn.tts_ttfb, type: metric, metric_name: lk.agents.turn.tts_ttfb, instrument: histogram, unit: s, stability: development, brief: "Time to the first TTS byte.", attributes: [{ref: model_name, requirement_level: recommended}, {ref: model_provider, requirement_level: recommended}]}
  - {id: metric.lk.agents.turn.transcription_delay, type: metric, metric_name: lk.agents.turn.transcription_delay, instrument: histogram, unit: s, stability: development, brief: "Delay from the end of speech to the final transcript.", attributes: [{ref: model_name, requirement_level: recommended}, {ref: model_provider, requirement_level: recommended}]}
  - {id: metric.lk.agents.turn.end_of_turn_delay, type: metric, metric_name: lk.agents.turn.end_of_turn_delay, instrument: histogram, unit: s, stability: development, brief: "Delay from the end of speech to the turn decision.", attributes: [{ref: model_name, requirement_level: recommended}, {ref: model_provider, requirement_level: recommended}]}
  - {id: metric.lk.agents.turn.on_user_turn_completed_delay, type: metric, metric_name: lk.agents.turn.on_user_turn_completed_delay, instrument: histogram, unit: s, stability: development, brief: "Duration of the `on_user_turn_completed` hook.", attributes: [{ref: model_name, requirement_level: recommended}, {ref: model_provider, requirement_level: recommended}]}
  - {id: metric.lk.agents.usage.llm_input_tokens, type: metric, metric_name: lk.agents.usage.llm_input_tokens, instrument: counter, unit: "", stability: development, brief: "LLM input tokens.", attributes: [{ref: model_name, requirement_level: recommended}, {ref: model_provider, requirement_level: recommended}]}
