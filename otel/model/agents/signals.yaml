  # --- GenAI span events and metrics no upstream registry defines today -------------------
  # The five message events and `gen_ai.client.token.usage` / `...time_to_first_chunk` are
  # deprecated in OTel semconv 1.44.0 and excluded from dependency resolution; Agents still
  # names them, so they are declared here as emitted. They are span events on `llm_node` and
  # the PII filter drops them whole; weaver's only event type is the log event.
  - id: event.gen_ai.system.message
    type: event
    name: gen_ai.system.message
    stability: development
    brief: OTel GenAI system (or developer) message, a span event on `llm_node`.
    note: Deprecated upstream (semconv 1.44.0 `gen-ai/deprecated/events-deprecated.yaml`); declared as emitted.
    annotations:
      livekit: {severity: [], body: "Not a log record: a span event whose `content` attribute carries the message."}
  - id: event.gen_ai.user.message
    type: event
    name: gen_ai.user.message
    stability: development
    brief: OTel GenAI user message, a span event on `llm_node`.
    note: Deprecated upstream (semconv 1.44.0 `gen-ai/deprecated/events-deprecated.yaml`); declared as emitted.
    annotations:
      livekit: {severity: [], body: "Not a log record: a span event whose `content` attribute carries the message."}
  - id: event.gen_ai.assistant.message
    type: event
    name: gen_ai.assistant.message
    stability: development
    brief: OTel GenAI assistant message (also a function call), a span event on `llm_node`.
    note: Deprecated upstream (semconv 1.44.0 `gen-ai/deprecated/events-deprecated.yaml`); declared as emitted.
    annotations:
      livekit: {severity: [], body: "Not a log record: a span event whose `content` attribute carries the message."}
  - id: event.gen_ai.tool.message
    type: event
    name: gen_ai.tool.message
    stability: development
    brief: OTel GenAI tool message (a function call output), a span event on `llm_node`.
    note: Deprecated upstream (semconv 1.44.0 `gen-ai/deprecated/events-deprecated.yaml`); declared as emitted.
    annotations:
      livekit: {severity: [], body: "Not a log record: a span event whose `content` attribute carries the message."}
  - id: event.gen_ai.choice
    type: event
    name: gen_ai.choice
    stability: development
    brief: OTel GenAI choice, a span event on `llm_node`.
    note: Deprecated upstream (semconv 1.44.0 `gen-ai/deprecated/events-deprecated.yaml`); declared as emitted.
    annotations:
      livekit: {severity: [], body: "Not a log record: a span event whose `content` attribute carries the message."}
  - {id: metric.gen_ai.client.token.usage, type: metric, metric_name: gen_ai.client.token.usage, instrument: histogram, unit: "{token}", stability: development, brief: "Input and output tokens used by the GenAI operation (deprecated upstream; declared as emitted).", attributes: [{ref: gen_ai.token.type, requirement_level: required}, {ref: gen_ai.operation.name, requirement_level: required}, {ref: gen_ai.provider.name, requirement_level: recommended}, {ref: gen_ai.request.model, requirement_level: recommended}]}
  - {id: metric.gen_ai.client.operation.time_to_first_chunk, type: metric, metric_name: gen_ai.client.operation.time_to_first_chunk, instrument: histogram, unit: s, stability: development, brief: "Time to the first chunk of a streaming GenAI response (deprecated upstream; declared as emitted).", attributes: [{ref: gen_ai.operation.name, requirement_level: required}, {ref: gen_ai.provider.name, requirement_level: recommended}, {ref: gen_ai.request.model, requirement_level: recommended}]}
