templates:
  - template: semconv.py.j2
    filter: '(.registry.attributes | map(.key)) as $local | {schema_url, attributes: .registry.attributes | sort_by(.key), upstream: ([.registry.spans[], .registry.events[], .registry.metrics[], .registry.attribute_groups[] | (.attributes // [])[] | select(.key as $k | $local | index($k) | not)] | group_by(.key) | map(.[0] + {shipped_values: ([.[] | (.annotations.livekit.shipped_values // [])[]] | unique_by(.value))})), events: .registry.events | sort_by(.name), spans: .registry.spans | sort_by(.type), checkpoints: [.registry.spans[] | (.annotations.livekit.checkpoints // [])[]] | unique_by(.name), metrics: [.registry.metrics[] | select(.provenance.source == null)] | sort_by(.name), upstream_metrics: [.registry.metrics[] | select(.provenance.source != null)] | sort_by(.name)}'
    application_mode: single
    file_name: semconv.py
