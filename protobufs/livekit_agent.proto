syntax = "proto3";

package livekit;
option go_package = "github.com/livekit/protocol/livekit";
option csharp_namespace = "LiveKit.Proto";
option ruby_package = "LiveKit::Proto";

import "livekit_models.proto";
import "logger/options.proto";

message Job {
  string id = 1;
  string dispatch_id = 9 [(logger.name) = "dispatchID"];
  JobType type = 2;
  Room room = 3;
  optional ParticipantInfo participant = 4;
  string namespace = 5 [deprecated = true];
  string metadata = 6 [(logger.sensitivity) = SENSITIVITY_PII];
  string agent_name = 7;
  JobState state = 8;
  bool enable_recording = 10;
  string deployment = 11;
  map<string, string> attributes = 12 [(logger.sensitivity) = SENSITIVITY_PII];
  bool enable_redaction = 13;
}

message JobState {
  JobStatus status = 1;
  string error = 2;
  int64 started_at = 3;
  int64 ended_at = 4;
  int64 updated_at = 5;
  string participant_identity = 6;
  string worker_id = 7 [(logger.name) = "workerID"];
  string agent_id = 8 [(logger.name) = "agentID"];
}

// from Worker to Server
message WorkerMessage {
  oneof message {
    // agent workers need to register themselves with the server first
    RegisterWorkerRequest register = 1;
    // worker confirms to server that it's available for a job, or declines it
    AvailabilityResponse availability = 2;

    // worker can update its status to the server, including taking itself out of the pool
    UpdateWorkerStatus update_worker = 3;
    // job can send status updates to the server, useful for tracking progress
    UpdateJobStatus update_job = 4;

    WorkerPing ping = 5;
    SimulateJobRequest simulate_job = 6;
    MigrateJobRequest migrate_job = 7;
  };
}

// from Server to Worker
message ServerMessage {
  oneof message {
    // server confirms the registration, from this moment on, the worker is considered active
    RegisterWorkerResponse register = 1;
    // server asks worker to confirm availability for a job
    AvailabilityRequest availability = 2;
    JobAssignment assignment = 3;
    JobTermination termination = 5;
    WorkerPong pong = 4;

    // the server is draining this control connection: re-register elsewhere,
    // in-flight agent HTTP streams run to completion
    AgentHttp.GoAway go_away = 6;
  }
}

enum JobType {
  JT_ROOM = 0;
  JT_PUBLISHER = 1;
  JT_PARTICIPANT = 2;
}

enum WorkerStatus {
  WS_AVAILABLE = 0;
  WS_FULL = 1;
}

enum JobStatus {
  JS_PENDING = 0;
  JS_RUNNING = 1;
  JS_SUCCESS = 2;
  JS_FAILED = 3;
}

message SimulateJobRequest {
  JobType type = 1;
  Room room = 2;
  ParticipantInfo participant = 3;
}

message WorkerPing {
  int64 timestamp = 1;
}

message WorkerPong {
  int64 last_timestamp = 1;
  int64 timestamp = 2;
}

message RegisterWorkerRequest {
  reserved 2, 4; // worker_id, name (retired)
  JobType type = 1;
  string agent_name = 8;
  string version = 3;
  uint32 ping_interval = 5;
  optional string namespace = 6;
  ParticipantPermission allowed_permissions = 7;
  string deployment = 9;

  // HTTP endpoints this worker serves through the data plane, in route order.
  // Empty means the worker exposes no endpoints and needs no data connections.
  repeated AgentHttp.AgentEndpoint endpoints = 10;
  // random per process; a re-registration with a new instance_id supersedes the
  // previous epoch and closes its remaining connections
  string instance_id = 11 [(logger.name) = "instanceID"];
  // highest data-plane protocol version the worker supports; 0 = unsupported
  uint32 endpoint_protocol = 12;
}

message RegisterWorkerResponse {
  reserved 2;
  string worker_id = 1 [(logger.name) = "workerID"];
  ServerInfo server_info = 3;
  // present iff the registration carried endpoints and the server supports the data plane
  AgentHttp.AgentEndpointSettings endpoint_settings = 4;
}

message MigrateJobRequest {
  // string job_id = 1 [deprecated = true];
  repeated string job_ids = 2;
}

message AvailabilityRequest {
  Job job = 1;

  // True when the job was previously assigned to another worker but has been
  // migrated due to different reasons (e.g. worker failure, job migration)
  bool resuming = 2;
}

message AvailabilityResponse {
  string job_id = 1 [(logger.name) = "jobID"];
  bool available = 2;
  bool supports_resume = 3;
  bool terminate = 8;

  string participant_name = 4;
  string participant_identity = 5;
  string participant_metadata = 6;
  map<string, string> participant_attributes = 7;
  // NEXT_ID: 9
}

message UpdateJobStatus {
  string job_id = 1 [(logger.name) = "jobID"];

  // The worker can indicate the job end by either specifying SUCCESS or FAILED
  JobStatus status = 2;

  // metadata shown on the dashboard, useful for debugging
  string error = 3;
}

message UpdateWorkerStatus {
  reserved 2; // metadata (retired)
  optional WorkerStatus status = 1;
  float load = 3;
  uint32 job_count = 4;

  // worker wants no new streams; existing streams run to completion
  bool draining = 5;
  // monotonic per registration; status updates may interleave across connections
  // and a stale report must not regress newer state
  uint64 seq = 6;
}

message JobAssignment {
  Job job = 1;
  optional string url = 2;
  string token = 3;
}

message JobTermination {
  string job_id = 1 [(logger.name) = "jobID"];
}

// ----- agent HTTP endpoints data plane -----
//
// AgentHttp namespaces the data plane: workers expose HTTP endpoints served at
// /agents/{agent_name}/{deployment}/{path} without binding any local listener.
// The worker opens ONE WebTransport (QUIC) session to /agent that carries both
// its control stream (the same WorkerMessage/ServerMessage exchange as the
// WebSocket control connection, length-delimited) and every HTTP exchange: the
// node opens one bidirectional QUIC stream per request, writes the opaque
// HTTP/1.1 request bytes, and reads the opaque response back, bridged into the
// worker's application in-process. QUIC provides the multiplexing, per-stream
// flow control, and half-close (stream FIN) / abort (RESET_STREAM), so there is
// no capsule framing, no credit accounting, and no attach handshake.
message AgentHttp {
  enum AgentEndpointKind {
    AEK_HTTP = 0;
    // reserved for future text-mode endpoints
    AEK_TEXT = 1;
  }

  message AgentEndpoint {
    // starlette-style path template rooted at '/': {name} (one segment, default),
    // {name:int}, {name:float}, {name:uuid} (constrained single segments),
    // {name:path} (multi-segment). Custom converters are rejected.
    string path = 1;
    // uppercase, exactly as the application routes them (FastAPI does not imply
    // HEAD from GET)
    repeated string methods = 2;
    AgentEndpointKind kind = 3;
    // reachable without a project token
    bool public = 4;
  }

  // registration-level settings negotiated on the control connection, returned
  // in RegisterWorkerResponse when the worker declares endpoints and the server
  // supports the data plane.
  message AgentEndpointSettings {
    // negotiated data-plane protocol version
    uint32 protocol = 1;
  }

  // the server is draining: the worker should re-register elsewhere; in-flight
  // HTTP exchanges run to completion
  message GoAway {
    string reason = 1;
  }
}
