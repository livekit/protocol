syntax = "proto3";

package livekit.agent;

option go_package = "github.com/livekit/protocol/livekit/agent";

import "logger/options.proto";

// A thread is the durable conversation an agent has with a person across
// channels. It is named by its "AT_" id and optionally by keys an application
// attaches to find it again; a key resolves to at most one thread per agent.
// Times are unix seconds.
message AgentThread {
  message AgentKey {
    string agent_name = 1;
    string key = 2;
  }

  message CreateRequest {
    string agent_name = 1;
    // When set, create is get-or-create on (agent_name, key).
    string key = 2;
    // The subject the thread belongs to, as scoped by an AgentThreadGrant.
    string sub = 3 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    // 0 takes the server default.
    int64 idle_ttl_seconds = 5;
  }

  message CreateResponse {
    Thread thread = 1;
    // False when the key already named a thread, which is returned as is.
    bool created = 2;
  }

  message GetRequest {
    oneof lookup {
      string thread_id = 1 [(logger.name) = "threadID"];
      AgentKey by_key = 2;
    }
  }

  // The threads of one subject under one agent, newest first.
  message ListRequest {
    string agent_name = 1;
    string sub = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    // Cursor from the previous ListResponse; empty for the first page.
    string before = 3;
    int32 limit = 4;
  }

  message ListResponse {
    repeated Thread threads = 1;
    // Empty at the end.
    string before = 2;
  }

  message UpdateRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    // Merged; an empty value deletes the entry.
    map<string, string> attributes = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    optional int64 idle_ttl_seconds = 3;
  }

  message TouchRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
  }

  message TouchResponse {
    int64 expires_at = 1;
  }

  message AddKeyRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    string key = 2;
    // 0 keeps the key for the life of the thread.
    int64 ttl_seconds = 3;
    // Move the key here when another thread of the same agent holds it.
    bool replace = 4;
  }

  message RemoveKeyRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    string key = 2;
  }

  message DeleteRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
  }

  message DeleteResponse {}

  // Creates the thread's database if it has none. Idempotent.
  message EnsureStateDatabaseRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
  }

  // Marks a thread as merged into redirect_to.
  message RedirectRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    string redirect_to = 2 [(logger.name) = "redirectTo"];
  }

  message Thread {
    string thread_id = 1 [(logger.name) = "threadID"];
    string agent_name = 2;
    // Keys themselves are never returned.
    uint32 key_count = 3;
    string sub = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 5 [(logger.sensitivity) = SENSITIVITY_PII];
    int64 created_at = 6;
    int64 last_active = 7;
    int64 expires_at = 8;
    int64 idle_ttl_seconds = 9;
    // "DB_..."; empty until the first write or EnsureStateDatabase.
    string database_id = 10;
    // Set when merged into another thread; calls on it then fail with
    // FailedPrecondition.
    string redirect_to = 11;
  }
}
