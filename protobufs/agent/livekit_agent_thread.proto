// AgentThread: the durable conversation between an agent and a person, across
// channels and over time. Identified by an "AT_" id. Holds a scope, attributes,
// an idle TTL and the AgentDB database created with it. An internal key (a
// LiveKit phone number) can find it again. Served by cloud-protocol's
// AgentThreads. The conversation inside follows thread_schema_v1.sql, shared
// by the agents framework, which writes it, and the platform, which reads it.

syntax = "proto3";

package livekit.agent;

option go_package = "github.com/livekit/protocol/livekit/agent";

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "agent/livekit_agent_session.proto";
import "logger/options.proto";

message AgentThread {
  message CreateRequest {
    reserved 1;
    // Internal: when set, create is get-or-create on key (e.g. a LiveKit phone
    // number). Not exposed by the public API.
    string key = 2;
    // Groups threads, e.g. by user: an application-defined value, typically the
    // user's identity. An AgentThreadGrant is scoped by it.
    string scope = 3 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    // Unset takes the server default.
    google.protobuf.Duration idle_ttl = 5;
  }

  message CreateResponse {
    Thread thread = 1;
    // False when the key already named a thread, which is returned as is.
    bool created = 2;
  }

  message GetRequest {
    oneof lookup {
      string thread_id = 1 [(logger.name) = "threadID"];
      string key = 2;
    }
  }

  // The threads of one scope, newest first.
  message ListRequest {
    reserved 1;
    string scope = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    // Cursor from the previous ListResponse; empty for the first page.
    string before = 3;
    int32 limit = 4;
  }

  message ListResponse {
    repeated Thread threads = 1;
    // Empty at the end.
    string before = 2;
  }

  message UpdateRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    // Added to the existing attributes; an empty value deletes the entry.
    map<string, string> attributes = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    google.protobuf.Duration idle_ttl = 3;
    // Every update counts as activity and pushes expires_at out by idle_ttl.
  }

  message DeleteRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
  }

  message DeleteResponse {}

  // The conversation, oldest first.
  message HistoryRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    // One agent's history; empty for every agent's.
    string agent = 2;
    // Cursor from the previous HistoryResponse; empty for the first page.
    string after = 3;
    int32 limit = 4;
  }

  message HistoryResponse {
    repeated Item items = 1;
    // Empty at the end.
    string after = 2;
  }

  // One chat item of an agent's history. Stored as the JSON of
  // ChatContext.ChatItem (items.payload in thread_schema_v1.sql).
  message Item {
    string agent = 1;
    // Position in the agent's history.
    int64 seq = 2;
    // The A2A message the item came from.
    string message_id = 3;
    ChatContext.ChatItem item = 4 [(logger.sensitivity) = SENSITIVITY_PII];
  }

  // The thread's A2A tasks, oldest first.
  message ListTasksRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    string agent = 2;
    string after = 3;
    int32 limit = 4;
  }

  message ListTasksResponse {
    repeated Task tasks = 1;
    string after = 2;
  }

  message Task {
    string task_id = 1;
    string agent = 2;
    // "submitted", "working", "input-required", "completed", "failed",
    // "canceled" or "rejected".
    string status = 3;
    google.protobuf.Struct status_message = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    repeated ChatContext.ChatItem history = 5 [(logger.sensitivity) = SENSITIVITY_PII];
    google.protobuf.ListValue artifacts = 6 [(logger.sensitivity) = SENSITIVITY_PII];
    // The task that submitted this one, if any.
    string parent = 7;
    google.protobuf.Timestamp updated_at = 8;
  }

  message Thread {
    string thread_id = 1 [(logger.name) = "threadID"];
    reserved 2;
    // Internal: the key the thread was created with, if any.
    string key = 3;
    string scope = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 5 [(logger.sensitivity) = SENSITIVITY_PII];
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp last_active = 7;
    // last_active + idle_ttl; every update pushes it out. The thread and its
    // database are deleted once it passes.
    google.protobuf.Timestamp expires_at = 8;
    google.protobuf.Duration idle_ttl = 9;
    // The thread's database ("DB_..."), created with the thread.
    string database_id = 10;
    reserved 11;
  }
}
