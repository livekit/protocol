// AgentThread: the durable conversation between an agent and a person, across
// channels and over time. Identified by an "AT_" id; keys (such as a phone
// number) find it again, at most one thread per key and agent. Holds a subject,
// attributes, an idle TTL and the AgentDB database with its state. Served by
// cloud-protocol's AgentThreads.

syntax = "proto3";

package livekit.agent;

option go_package = "github.com/livekit/protocol/livekit/agent";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "logger/options.proto";

message AgentThread {
  message AgentKey {
    string agent_name = 1;
    string key = 2;
  }

  message CreateRequest {
    string agent_name = 1;
    // When set, create is get-or-create on (agent_name, key).
    string key = 2;
    // Groups threads, e.g. by user: an application-defined value, typically the
    // user's identity. An AgentThreadGrant is scoped by it.
    string subject = 3 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    // Unset takes the server default.
    google.protobuf.Duration idle_ttl = 5;
  }

  message CreateResponse {
    Thread thread = 1;
    // False when the key already named a thread, which is returned as is.
    bool created = 2;
  }

  message GetRequest {
    oneof lookup {
      string thread_id = 1 [(logger.name) = "threadID"];
      AgentKey by_key = 2;
    }
  }

  // The threads of one subject under one agent, newest first.
  message ListRequest {
    string agent_name = 1;
    string subject = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    // Cursor from the previous ListResponse; empty for the first page.
    string before = 3;
    int32 limit = 4;
  }

  message ListResponse {
    repeated Thread threads = 1;
    // Empty at the end.
    string before = 2;
  }

  message UpdateRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    // Merged; an empty value deletes the entry.
    map<string, string> attributes = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    google.protobuf.Duration idle_ttl = 3;
  }

  message TouchRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
  }

  message TouchResponse {
    google.protobuf.Timestamp expires_at = 1;
  }

  message AddKeyRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    string key = 2;
    // Unset keeps the key for the life of the thread.
    google.protobuf.Duration ttl = 3;
    // Move the key here when another thread of the same agent holds it.
    bool replace = 4;
  }

  message RemoveKeyRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    string key = 2;
  }

  message DeleteRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
  }

  message DeleteResponse {}

  // Creates the thread's database if it has none. Idempotent.
  message CreateThreadDatabaseRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
  }

  // Marks thread_id as merged into another thread, after its items were copied
  // there.
  message MergeThreadRequest {
    string thread_id = 1 [(logger.name) = "threadID"];
    string into = 2;
  }

  message Thread {
    string thread_id = 1 [(logger.name) = "threadID"];
    string agent_name = 2;
    // Keys themselves are never returned.
    uint32 key_count = 3;
    string subject = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 5 [(logger.sensitivity) = SENSITIVITY_PII];
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp last_active = 7;
    // last_active + idle_ttl; every touch or send pushes it out. The thread is
    // deleted once it passes.
    google.protobuf.Timestamp expires_at = 8;
    google.protobuf.Duration idle_ttl = 9;
    // "DB_..."; empty until the first write or CreateThreadDatabase.
    string database_id = 10;
    // Set when merged into another thread; calls on it then fail with
    // FailedPrecondition.
    string merged_into = 11;
  }
}
