syntax = "proto3";

package livekit.agent;

option go_package = "github.com/livekit/protocol/livekit/agent";

import "logger/options.proto";

// AgentSessionRegistry is the public API over agent sessions: the durable
// conversation an agent has with a person across channels and over time. The
// project comes from the access token. A session is named by its "AT_" id and
// optionally by keys, opaque strings an application attaches ("phone:+1...")
// to find it again; a key resolves to at most one session per agent.
//
// Errors are Twirp codes:
//   already_exists       a key attached to another session, without replace
//   invalid_argument     an unknown region, or a key, sub or attribute over
//                        its size limit
//   failed_precondition  the session was redirected; the caller re-reads at
//                        Session.redirect_to
//   permission_denied    a session, subject or agent outside the token's
//                        AgentSessionGrant
//   not_found            otherwise
service AgentSessionRegistry {
  // A keyed create is get-or-create: if the key already names a session of
  // this agent, that session is returned with created = false and nothing
  // else in the request is applied. Without a key a new session is always
  // created.
  rpc CreateSession(SessionRegistry.CreateRequest) returns (SessionRegistry.CreateResponse);
  // By id, or by (agent_name, key). The lookup by key is reserved to the
  // project credential; an AgentSessionGrant may only read by id.
  rpc GetSession(SessionRegistry.GetRequest) returns (SessionRegistry.Session);
  // The sessions of one subject under one agent, newest first.
  rpc ListSessions(SessionRegistry.ListRequest) returns (SessionRegistry.ListResponse);
  // Attributes and idle TTL. Not available to an AgentSessionGrant: attributes
  // are written by the agent's tools or by the application's backend.
  rpc UpdateSession(SessionRegistry.UpdateRequest) returns (SessionRegistry.Session);
  // Marks the session active now and pushes expires_at out by its idle TTL.
  rpc TouchSession(SessionRegistry.TouchRequest) returns (SessionRegistry.TouchResponse);
  // Attaches a key. A key already attached to another session of the same
  // agent is already_exists unless replace is set, which moves it.
  rpc AddSessionKey(SessionRegistry.AddKeyRequest) returns (SessionRegistry.Session);
  rpc RemoveSessionKey(SessionRegistry.RemoveKeyRequest) returns (SessionRegistry.Session);
  // Deletes the session, its keys and its database.
  rpc DeleteSession(SessionRegistry.DeleteRequest) returns (SessionRegistry.DeleteResponse);
  // Creates the session's database if it has none and records it on the
  // session. Idempotent: a second call returns the same database_id.
  rpc EnsureStateDatabase(SessionRegistry.EnsureRequest) returns (SessionRegistry.Session);
}

// Nested so that names like Session and CreateRequest need not be unique
// across the livekit.agent package. Times throughout are int64 unix seconds.
message SessionRegistry {
  // One key under one agent. Keys are scoped per agent: the same string under
  // two agents names two sessions.
  message AgentKey {
    string agent_name = 1;
    string key = 2 [(logger.sensitivity) = SENSITIVITY_PII];
  }

  message CreateRequest {
    string agent_name = 1;
    // Optional. When set the call is get-or-create on (agent_name, key). At
    // most 256 bytes.
    string key = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    // Optional. The subject the session belongs to, the value ListSessions
    // selects on and an AgentSessionGrant is scoped by. At most 256 bytes.
    string sub = 3 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    // 0 takes the server default. The session expires this long after its
    // last activity.
    int64 idle_ttl_seconds = 5;
    // Where the session's database lives. Validated against the configured
    // storage regions; empty means the caller's region.
    string region = 6;
  }

  message CreateResponse {
    Session session = 1;
    // False when a key in the request already named a session, which is the
    // one returned.
    bool created = 2;
  }

  message GetRequest {
    oneof lookup {
      string session_id = 1 [(logger.name) = "sessionID"];
      AgentKey by_key = 2;
    }
  }

  message ListRequest {
    string agent_name = 1;
    string sub = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    // Optional. The cursor from the previous page's ListResponse.before;
    // opaque to the client. Empty starts from the newest session.
    string before = 3;
    // Server-clamped.
    int32 limit = 4;
  }

  message ListResponse {
    repeated Session sessions = 1;
    // The cursor for the next page; empty at the end.
    string before = 2;
  }

  message UpdateRequest {
    string session_id = 1 [(logger.name) = "sessionID"];
    // Merged into the session's attributes: a key with an empty value deletes
    // the entry, keys not present are left alone.
    map<string, string> attributes = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    optional int64 idle_ttl_seconds = 3;
  }

  message TouchRequest {
    string session_id = 1 [(logger.name) = "sessionID"];
  }

  message TouchResponse {
    int64 expires_at = 1;
  }

  message AddKeyRequest {
    string session_id = 1 [(logger.name) = "sessionID"];
    // At most 256 bytes.
    string key = 2 [(logger.sensitivity) = SENSITIVITY_PII];
    // Optional. The key is dropped this long after it is attached; 0 keeps it
    // for the life of the session.
    int64 ttl_seconds = 3;
    // Move the key here when another session of the same agent holds it.
    bool replace = 4;
  }

  message RemoveKeyRequest {
    string session_id = 1 [(logger.name) = "sessionID"];
    string key = 2 [(logger.sensitivity) = SENSITIVITY_PII];
  }

  message DeleteRequest {
    string session_id = 1 [(logger.name) = "sessionID"];
  }

  message DeleteResponse {}

  message EnsureRequest {
    string session_id = 1 [(logger.name) = "sessionID"];
  }

  // One session, as every read reports it. Keys are never returned, by any
  // call and with any token: only their count is.
  message Session {
    string session_id = 1 [(logger.name) = "sessionID"];
    // The agent that created the session.
    string agent_name = 2;
    uint32 key_count = 3;
    string sub = 4 [(logger.sensitivity) = SENSITIVITY_PII];
    map<string, string> attributes = 5 [(logger.sensitivity) = SENSITIVITY_PII];
    int64 created_at = 6;
    int64 last_active = 7;
    int64 expires_at = 8;
    int64 idle_ttl_seconds = 9;
    string region = 10;
    // The session's database on agent-db, "DB_..."; empty until the first
    // write or EnsureStateDatabase.
    string database_id = 11;
    // Set when this session was merged into another. The registry reports the
    // redirect and never follows it: calls on a redirected session fail with
    // failed_precondition and the caller re-reads at this id.
    string redirect_to = 12;
  }
}
