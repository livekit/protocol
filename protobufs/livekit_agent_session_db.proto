syntax = "proto3";

package livekit;

option go_package = "github.com/livekit/protocol/livekit";
option csharp_namespace = "LiveKit.Proto";
option ruby_package = "LiveKit::Proto";

// Data plane for AgentSessionStore databases: one WebSocket per session, one
// protobuf message per frame, requests and responses correlated by a
// client-chosen request_id.
//
// Query results stream as SessionColumnBatch frames paced by the credits the
// client advertises (SessionCredit): the server never sends more un-consumed
// batches than granted.

message SessionStoreRequest {
  uint32 request_id = 1;
  oneof message {
    SessionHello hello = 2;           // must be first on the socket
    SessionStatement exec = 3;        // no result rows; answers SessionExecResult
    SessionStatement query = 4;       // answers SessionColumns + SessionColumnBatch* + SessionDone
    SessionBatch batch = 5;           // atomic multi-statement exec
    SessionBegin begin = 6;           // interactive transaction (server enforces idle/duration timeouts)
    SessionCommit commit = 7;
    SessionRollback rollback = 8;
    SessionCancel cancel = 9;         // stop a running query's stream/cursor
    SessionCredit credit = 10;        // grant more batch credits for request_id
    SessionPing ping = 11;
  }
}

message SessionStoreResponse {
  uint32 request_id = 1;
  oneof message {
    SessionHelloOk hello_ok = 2;
    SessionColumns columns = 3;
    SessionColumnBatch column_batch = 4;
    SessionExecResult exec_result = 5;
    SessionDone done = 6;
    SessionStoreError error = 7;
    SessionPong pong = 8;
  }
}

// SessionQueryLang selects the query language of a statement; both execute
// against the same session database.
enum SessionQueryLang {
  SESSION_QUERY_LANG_SQL = 0;
  SESSION_QUERY_LANG_CYPHER = 1;
}

// SessionValue mirrors SQLite's five storage classes exactly.
message SessionValue {
  oneof value {
    bool null_value = 1;   // always true when set
    int64 int_value = 2;
    double double_value = 3;
    string text_value = 4;
    bytes blob_value = 5;
  }
}

message SessionStatement {
  string sql = 1;                     // statement text in the selected lang
  repeated SessionValue params = 2;   // positional bind parameters
  SessionQueryLang lang = 3;
}

message SessionBatch {
  repeated SessionStatement statements = 1;  // applied atomically, in order
}

message SessionBegin {}
message SessionCommit {}
message SessionRollback {}
message SessionCancel {}

message SessionCredit {
  uint32 batches = 1;                 // additional batch frames the client can absorb
}

message SessionPing {
  int64 timestamp = 1;
}

message SessionPong {
  int64 last_ping_timestamp = 1;
  int64 timestamp = 2;
}

message SessionHello {
  string token = 1;                   // access token; authorization is checked here
  string session_id = 2;
}

message SessionHelloOk {
  int64 tip = 1;                      // latest durable commit sequence
  uint32 ping_interval_ms = 2;        // server-advertised keepalive cadence
  uint32 ping_timeout_ms = 3;
}

message SessionColumns {
  repeated string names = 1;
}

// SessionValueType tags one value's storage class within a SessionColumn.
enum SessionValueType {
  SESSION_VALUE_TYPE_NULL = 0;
  SESSION_VALUE_TYPE_INT = 1;
  SESSION_VALUE_TYPE_DOUBLE = 2;
  SESSION_VALUE_TYPE_TEXT = 3;
  SESSION_VALUE_TYPE_BLOB = 4;
}

// SessionColumn is one column of a batch. Values are typed individually, as
// SQLite types them, so a column may mix classes: walk `types` and take the next
// entry from the matching array. A NULL occupies a tag only.
message SessionColumn {
  bytes types = 1;              // one SessionValueType per row
  repeated sint64 ints = 2;
  repeated double doubles = 3;
  // Values concatenated, one exclusive end offset each: value i is
  // data[ends[i-1]:ends[i]], with 0 implied before the first.
  bytes text_data = 4;
  repeated uint32 text_ends = 5;
  bytes blob_data = 6;
  repeated uint32 blob_ends = 7;
}

message SessionColumnBatch {
  repeated SessionColumn columns = 1;  // one per column of SessionColumns
  uint32 rows = 2;
}

message SessionExecResult {
  int64 rows_affected = 1;
  int64 last_insert_id = 2;
  int64 tip = 3;                      // durable commit sequence after this exec
}

message SessionDone {
  int64 tip = 1;                      // snapshot the query ran at
  uint64 total_rows = 2;
}

message SessionStoreError {
  string code = 1;                    // stable machine-readable code
  string message = 2;
}
