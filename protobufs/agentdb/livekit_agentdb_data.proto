syntax = "proto3";

package livekit.agentdb;

option go_package = "github.com/livekit/protocol/livekit/agentdb";
option csharp_namespace = "LiveKit.Proto";
option ruby_package = "LiveKit::Proto";

// Data plane for AgentDB databases: one WebSocket per database, one
// protobuf message per frame, requests and responses correlated by a
// client-chosen request_id.
//
// Query results stream as ColumnBatch frames paced by the credits the
// client advertises (Credit): the server never sends more un-consumed
// batches than granted.

message ClientMessage {
  uint32 request_id = 1;
  oneof message {
    Hello hello = 2;           // must be first on the socket
    Statement exec = 3;        // no result rows; answers ExecResult
    Statement query = 4;       // answers Columns + ColumnBatch* + Done
    Batch batch = 5;           // atomic multi-statement exec
    Begin begin = 6;           // interactive transaction (server enforces idle/duration timeouts)
    Commit commit = 7;
    Rollback rollback = 8;
    Cancel cancel = 9;         // stop a running query's stream/cursor
    Credit credit = 10;        // grant more batch credits for request_id
    Ping ping = 11;
  }
}

message ServerMessage {
  uint32 request_id = 1;
  oneof message {
    HelloOk hello_ok = 2;
    Columns columns = 3;
    ColumnBatch column_batch = 4;
    ExecResult exec_result = 5;
    Done done = 6;
    Error error = 7;
    Pong pong = 8;
  }
}

// QueryLang selects the query language of a statement; both execute
// against the same database.
enum QueryLang {
  QUERY_LANG_SQL = 0;
  QUERY_LANG_CYPHER = 1;
}

// Value mirrors SQLite's five storage classes exactly.
message Value {
  oneof value {
    bool null_value = 1;   // always true when set
    int64 int_value = 2;
    double double_value = 3;
    string text_value = 4;
    bytes blob_value = 5;
  }
}

message Statement {
  string sql = 1;                     // statement text in the selected lang
  repeated Value params = 2;   // positional bind parameters
  QueryLang lang = 3;
}

message Batch {
  repeated Statement statements = 1;  // applied atomically, in order
}

message Begin {}
message Commit {}
message Rollback {}
message Cancel {}

message Credit {
  uint32 batches = 1;                 // additional batch frames the client can absorb
}

message Ping {
  int64 timestamp = 1;
}

message Pong {
  int64 last_ping_timestamp = 1;
  int64 timestamp = 2;
}

message Hello {
  string token = 1;                   // access token; authorization is checked here
  string database_id = 2;
}

message HelloOk {
  int64 tip = 1;                      // latest durable commit sequence
  uint32 ping_interval_ms = 2;        // server-advertised keepalive cadence
  uint32 ping_timeout_ms = 3;
}

message Columns {
  repeated string names = 1;
}

// ValueType tags one value's storage class within a Column.
enum ValueType {
  VALUE_TYPE_NULL = 0;
  VALUE_TYPE_INT = 1;
  VALUE_TYPE_DOUBLE = 2;
  VALUE_TYPE_TEXT = 3;
  VALUE_TYPE_BLOB = 4;
}

// Column is one column of a batch. Values are typed individually, as
// SQLite types them, so a column may mix classes: walk `types` and take the next
// entry from the matching array. A NULL occupies a tag only.
message Column {
  bytes types = 1;              // one ValueType per row
  repeated sint64 ints = 2;
  repeated double doubles = 3;
  // Values concatenated, one exclusive end offset each: value i is
  // data[ends[i-1]:ends[i]], with 0 implied before the first.
  bytes text_data = 4;
  repeated uint32 text_ends = 5;
  bytes blob_data = 6;
  repeated uint32 blob_ends = 7;
}

message ColumnBatch {
  repeated Column columns = 1;  // one per column of Columns
  uint32 rows = 2;
}

message ExecResult {
  int64 rows_affected = 1;
  int64 last_insert_id = 2;
  int64 tip = 3;                      // durable commit sequence after this exec
}

message Done {
  int64 tip = 1;                      // snapshot the query ran at
  uint64 total_rows = 2;
}

message Error {
  string code = 1;                    // stable machine-readable code
  string message = 2;
}
