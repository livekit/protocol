syntax = "proto3";

package livekit.agentdb;

option go_package = "github.com/livekit/protocol/livekit/agentdb";
option csharp_namespace = "LiveKit.Proto";
option ruby_package = "LiveKit::Proto";

// AgentDB hands out SQLite databases: lifecycle and export. Querying goes
// through the data plane in livekit_agentdb_data.proto. The project comes from
// the access token, never from a request field.
service AgentDB {
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  rpc GetDatabase(GetDatabaseRequest) returns (GetDatabaseResponse);
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);

  // Deletes the stored data too, not just the metadata row.
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse);

  // Exports a consistent SQLite file, returning a time-limited download URL.
  rpc Dump(DumpDatabaseRequest) returns (DumpDatabaseResponse);
}

message CreateDatabaseRequest {
  string region = 1;
  string user_attributes = 2;  // opaque JSON metadata for the caller
  int64 ttl_seconds = 3;       // unset: never expires. Otherwise clamped to the server cap, and never extended
}

message CreateDatabaseResponse {
  string database_id = 1;      // "DB_..."
  int64 expires_at_unix = 2;   // 0: never expires
}

message GetDatabaseRequest {
  string database_id = 1;
}

message GetDatabaseResponse {
  string database_id = 1;
  string region = 2;
  string user_attributes = 3;
  int64 created_at_unix = 4;
  int64 expires_at_unix = 5;   // 0: never expires
  int64 tip = 6;               // latest durable commit sequence
}

message ListDatabasesRequest {
  int32 page_size = 1;         // server-clamped
  string page_token = 2;       // opaque cursor from a previous response
}

message ListDatabasesResponse {
  repeated DatabaseSummary databases = 1;
  string next_page_token = 2;  // empty when exhausted
}

// DatabaseSummary is a database's immutable fields. No tip: it changes on every
// commit, so call GetDatabase for it.
message DatabaseSummary {
  string database_id = 1;
  string region = 2;
  string user_attributes = 3;
  int64 created_at_unix = 4;
  int64 expires_at_unix = 5;   // 0: never expires
}

message DeleteDatabaseRequest {
  string database_id = 1;
}

message DeleteDatabaseResponse {}

message DumpDatabaseRequest {
  string database_id = 1;
}

message DumpDatabaseResponse {
  string download_url = 1;     // pre-authenticated object-storage URL
  int64 expires_at_unix = 2;   // URL expiry
  int64 tip = 3;               // commit sequence the dump is consistent at
}
