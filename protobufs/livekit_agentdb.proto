// AgentDB: per-agent SQLite databases. Each lives in its project's data region
// on object storage, with one writer at a time. Queries run over the WebSocket
// data plane (AgentDB.Wire); lifecycle is cloud-protocol's AgentDB service.

syntax = "proto3";

package livekit;

option go_package = "github.com/livekit/protocol/livekit";
option csharp_namespace = "LiveKit.Proto";
option ruby_package = "LiveKit::Proto";

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "logger/options.proto";

// Nested so that names like Value and Ping need not be unique across the
// livekit package. `tip` throughout is the latest durable commit sequence.
message AgentDB {
  // Whether a request answered with an error may have taken effect. The zero
  // value is the safe reading, so a code without the option, or one a reader
  // does not know, is MAYBE.
  enum Applied {
    APPLIED_MAYBE = 0;           // it may have committed, whole: resend only under its idempotency key
    APPLIED_NO = 1;              // nothing took effect
  }

  // Whether the same request can succeed if sent again. The zero value is the
  // safe reading: a code without the option, or one a reader does not know,
  // is NEVER.
  enum Retry {
    RETRY_NEVER = 0;             // the same request fails the same way
    RETRY_HERE = 1;              // on the same connection, after a backoff
    RETRY_ELSEWHERE = 2;         // on a new connection, which may reach another node
  }

  extend google.protobuf.EnumValueOptions {
    Applied applied = 1290;
    Retry retry = 1291;
  }

  // Every error agent-db reports, on the data plane (Wire.Error.code) and on
  // the management services, each with what a client may conclude from it. A
  // code travels as its name in lowercase ("unavailable"). The management
  // services carry it as their gRPC status code: 1 to 16 are the gRPC codes,
  // by number and name, and gRPC's UNKNOWN (2) is UNKNOWN. A code a reader
  // does not know is UNKNOWN. INTERNAL is a broken invariant, after which a
  // write may have applied.
  enum ErrorCode {
    UNKNOWN = 0;
    CANCELED = 1 [(applied) = APPLIED_MAYBE, (retry) = RETRY_HERE];
    reserved 2;
    INVALID_ARGUMENT = 3 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    DEADLINE_EXCEEDED = 4 [(applied) = APPLIED_MAYBE, (retry) = RETRY_HERE];
    NOT_FOUND = 5 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    ALREADY_EXISTS = 6 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    PERMISSION_DENIED = 7 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    RESOURCE_EXHAUSTED = 8 [(applied) = APPLIED_NO, (retry) = RETRY_HERE];
    FAILED_PRECONDITION = 9 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    ABORTED = 10 [(applied) = APPLIED_NO, (retry) = RETRY_HERE];
    OUT_OF_RANGE = 11 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    UNIMPLEMENTED = 12 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    INTERNAL = 13 [(applied) = APPLIED_MAYBE, (retry) = RETRY_NEVER];
    // The node cannot serve the database: not its owner, or the database
    // closed under the request. A write may have committed before it did.
    UNAVAILABLE = 14 [(applied) = APPLIED_MAYBE, (retry) = RETRY_ELSEWHERE];
    DATA_LOSS = 15 [(applied) = APPLIED_MAYBE, (retry) = RETRY_NEVER];
    UNAUTHENTICATED = 16 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];

    // The data plane's own.
    PROTOCOL = 17 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];      // a frame out of order or unknown
    EXEC = 18 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];          // a statement the engine refused
    QUERY = 19 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];
    TXN = 20 [(applied) = APPLIED_NO, (retry) = RETRY_NEVER];           // a Begin, Commit or Rollback refused
    RETRY = 21 [(applied) = APPLIED_NO, (retry) = RETRY_HERE];          // refused before it applied anything
    // A write whose durable flush failed: it may have committed, whole.
    OUTCOME_UNKNOWN = 22 [(applied) = APPLIED_MAYBE, (retry) = RETRY_HERE];
    // A notice on request id 0: the database was evicted while the connection
    // had nothing in flight, and the socket ends. Redial when next needed.
    IDLE_EVICTED = 23 [(applied) = APPLIED_NO, (retry) = RETRY_ELSEWHERE];
    // A Rollback of a transaction the server had already aborted: none of it
    // applied, and the whole transaction may run again.
    TXN_ABORTED = 24 [(applied) = APPLIED_NO, (retry) = RETRY_HERE];
  }

  message CreateRequest {
    // Unset: never expires, and expires_at is then unset everywhere.
    // Otherwise clamped to the server cap, and never extended.
    google.protobuf.Duration ttl = 1;
  }

  message CreateResponse {
    string database_id = 1;      // "DB_..." for a standalone database, the thread id ("AT_...") for a thread's
    google.protobuf.Timestamp expires_at = 2;
  }

  message GetRequest {
    string database_id = 1;
  }

  message ListRequest {
    int32 page_size = 1;         // server-clamped
    string page_token = 2;
  }

  message ListResponse {
    repeated AgentDatabase databases = 1;
    string next_page_token = 2;  // empty when exhausted
  }

  // One database, as get and list both report it.
  message AgentDatabase {
    string database_id = 1;
    string region = 2;
    google.protobuf.Timestamp created_at = 3;
    google.protobuf.Timestamp expires_at = 4;
    int64 tip = 5;
  }

  message DeleteRequest {
    string database_id = 1;
  }

  message DeleteResponse {}

  message ExportRequest {
    string database_id = 1;
  }

  message ExportResponse {
    string download_url = 1;     // pre-authenticated object-storage URL
    google.protobuf.Timestamp expires_at = 2;  // of the URL, not the database
    int64 tip = 3;               // what the export is consistent at
  }

  // Data plane: one WebSocket per database, one message per frame, correlated
  // by a client-chosen request_id. Result batches are paced by Credit, so the
  // server never sends more un-consumed batches than granted.
  message Wire {
    message ClientMessage {
      uint32 request_id = 1;
      oneof message {
        Hello hello = 2;           // must be first on the socket
        Statement exec = 3;        // answers ExecResult
        Statement query = 4;       // answers Columns + ColumnBatch* + Done
        Batch batch = 5;           // answers one result per statement, then Done
        Begin begin = 6;
        Commit commit = 7;
        Rollback rollback = 8;
        Cancel cancel = 9;
        Credit credit = 10;
        Ping ping = 11;
      }
    }

    message ServerMessage {
      uint32 request_id = 1;
      oneof message {
        HelloOk hello_ok = 2;
        Columns columns = 3;
        ColumnBatch column_batch = 4;
        ExecResult exec_result = 5;
        Done done = 6;
        Error error = 7;
        Pong pong = 8;
      }
    }

    enum QueryLang {
      SQL = 0;
      reserved 1;
    }

    // SQLite's five storage classes.
    message Value {
      oneof value {
        bool null_value = 1;   // always true when set
        int64 int_value = 2;
        double double_value = 3;
        string text_value = 4;
        bytes blob_value = 5;
      }
    }

    message Statement {
      string sql = 1;
      repeated Value params = 2;   // positional
      QueryLang lang = 3;
    }

    // Applied atomically, in order, and answered with one result per
    // statement, in order: Columns then ColumnBatch frames for a statement
    // that returns rows, one ExecResult for one that does not, each tagged
    // with the statement's 0-based index, then a single Done for the whole
    // batch. A statement that returns no rows still sends its Columns. Credit
    // paces the ColumnBatch frames of the batch as a whole.
    message Batch {
      repeated Statement statements = 1;
    }

    message Begin {}
    message Commit {}
    message Rollback {}
    message Cancel {}

    message Credit {
      uint32 batches = 1;          // additional batches the client can absorb
    }

    message Ping {
      int64 timestamp_ms = 1;
    }

    message Pong {
      int64 last_ping_timestamp_ms = 1;
      int64 timestamp_ms = 2;
    }

    message Hello {
      string token = 1 [(logger.sensitivity) = SENSITIVITY_SECRET];
      string database_id = 2;
    }

    message HelloOk {
      int64 tip = 1;
      uint32 ping_interval_ms = 2;
      uint32 ping_timeout_ms = 3;
    }

    message Columns {
      repeated string names = 1;
      uint32 statement = 2;        // index within a Batch; 0 and unused for a Query
    }

    enum ValueType {
      NULL = 0;
      INT = 1;
      DOUBLE = 2;
      TEXT = 3;
      BLOB = 4;
    }

    // Values are typed per row, as SQLite types them, so a column may mix
    // classes: walk `types` and take the next entry from the matching array. Text
    // and blobs are concatenated with one exclusive end offset each, so value i
    // is data[ends[i-1]:ends[i]] with 0 implied before the first. A NULL occupies
    // a tag only.
    message Column {
      bytes types = 1;             // one ValueType per row
      repeated sint64 ints = 2;
      repeated double doubles = 3;
      bytes text_data = 4;
      repeated uint32 text_ends = 5;
      bytes blob_data = 6;
      repeated uint32 blob_ends = 7;
    }

    message ColumnBatch {
      repeated Column columns = 1; // one per name in Columns
      uint32 rows = 2;
      uint32 statement = 3;        // index within a Batch; 0 and unused for a Query
    }

    message ExecResult {
      int64 rows_affected = 1;
      int64 last_insert_id = 2;
      int64 tip = 3;
      uint32 statement = 4;        // index within a Batch; 0 and unused for an Exec
    }

    message Done {
      int64 tip = 1;               // the snapshot the query ran at
      uint64 total_rows = 2;
    }

    message Error {
      // An ErrorCode's name in lowercase, kept a string so that a reader
      // older than a code still reads it, as UNKNOWN.
      string code = 1;
      string message = 2;
    }
  }
}
