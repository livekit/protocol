name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # Lint and test only read the checkout

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          # setup-go's own cache restores on an exact key only, so any go.sum
          # change is a full cold build. Restored below instead.
          cache: false

      # The run_id suffix never pre-exists, so a push always writes a fresh
      # entry rather than one frozen at the go.sum that first created it.
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Set up gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@9eae5abc81d6d08f73268741ef4a8b97f29b60d8 # v2.4.1

      - name: Download Go modules
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        run: |
          set -euo pipefail
          MallocNanoZone=0 go test -race -json -v ./... 2>&1 | gotestfmt

      # Only main writes. Pull requests read main's entry, which keeps ~1 GB
      # per PR run out of the repo's 10 GB cache budget.
      - name: Save Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # A field name that is a keyword in a target language cannot be addressed by
  # name in that language. protoc's Python stub generator silently degrades:
  # `from` cost python-sdks a red mypy gate days later, on an unrelated PR.
  proto-lint:
    runs-on: ubuntu-latest
    # setup-protoc uses the token only to raise its release-download rate limit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install api-linter
        run: go install github.com/googleapis/api-linter/cmd/api-linter@v1.72.0

      # Run from protobufs/: api-linter resolves the files it lints against the
      # working directory, and uses -I only for their imports.
      - name: Check for reserved words in field names
        run: |
          set -euo pipefail
          go mod download github.com/livekit/psrpc
          psrpc=$(go list -m -f '{{.Dir}}' github.com/livekit/psrpc)
          test -d "$psrpc/protoc-gen-psrpc/options"
          psrpc="$psrpc/protoc-gen-psrpc/options"
          cd protobufs
          api-linter --config ../.api-linter.yaml --set-exit-status \
            -I . -I "$psrpc" \
            $(find . -name '*.proto' | sed 's|^\./||')

      # The reserved-word rule matches a list; this asks the generator. A stub
      # falls back to an untyped **kwargs whenever protoc cannot emit a keyword
      # argument for a field, whatever the reason.
      - name: Check the Python stubs name every field
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          protoc -I=protobufs --pyi_out="$out" \
            protobufs/livekit_*.proto protobufs/agent/*.proto protobufs/logger/*.proto
          if grep -rn '\*\*kwargs' "$out"; then
            echo "::error::a field name above is unaddressable in Python; rename it" >&2
            exit 1
          fi
