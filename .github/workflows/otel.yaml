name: Telemetry conventions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["otel/**", ".github/workflows/otel.yaml"]
  pull_request:
    branches: [main]
    paths: ["otel/**", ".github/workflows/otel.yaml"]

permissions:
  contents: read # Checks only read the checkout

jobs:
  weaver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@51a5bf95bdbb2e20fb6e16638e6bbe7dde911e93 # v0.28.0
        with:
          version: "0.28.0"

      - name: Check the registry
        run: otel/check.sh

      - name: Policy negatives fail with their named finding
        run: otel/tests/negatives.sh

      # The Generate workflow regenerates otel/gen on every push to a branch and commits any
      # change, as it does for the protobuf code. That commit is pushed with the workflow
      # token and does not run these checks by itself (GitHub can ask a maintainer to approve
      # that run); push again to run them. This check fails a commit whose otel/gen is stale.
      - name: Generated outputs are current
        run: |
          otel/generate.sh
          git add --intent-to-add otel/gen
          git diff --exit-code -- otel/gen

      - name: Generated outputs compile
        run: |
          rustc --edition 2021 --crate-type lib -D warnings -D missing_docs otel/gen/rust/semconv.rs --out-dir "$RUNNER_TEMP"
          npx --yes -p typescript@5.9.3 tsc --strict --noEmit --target es2020 otel/gen/ts/semconv.ts

      - name: Codegen escapes literals (round-trip through rustc and tsc)
        run: otel/tests/codegen.sh

      - name: Live-check the smoke sample
        run: otel/tests/live-check.sh
