name: Generate

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ">=1.26"

      - name: Go mod tidy
        run: go mod tidy

      - name: Install generators
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          install-only: true

      - name: Bootstrap
        run: mage bootstrap

      - name: Generate Protobuf
        run: mage proto

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Use Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install

      - name: Test generate JS files
        run: |
          pnpm --filter @livekit/protocol run generate:proto

      - name: Add changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          add: '["livekit", "replay", "rpc", "infra", "packages/javascript/src/gen"]'
          default_author: github_actions
          message: generated protobuf
