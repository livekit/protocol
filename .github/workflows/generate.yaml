name: Generate

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write # Required to commit the regenerated output

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned exactly, not floated: protoc stamps its version into every generated
      # file, so a release bump rewrites the committed output. Moving this is a
      # deliberate edit whose header churn is reviewable on its own.
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Download Go modules
        run: go mod download

      # The protoc plugins and mage itself come from the tool directives in go.mod, so
      # generation runs the versions pinned there instead of whatever is latest today.
      - name: Generate Protobuf
        run: go tool mage proto

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install

      - name: Test generate JS files
        run: |
          pnpm --filter @livekit/protocol run generate:proto

      # Only the telemetry conventions in otel/ need weaver; the protobuf and JS generation
      # above do not. Pinned like otel.yaml, which checks the registry. A failure in this step
      # or the next leaves otel/gen as it was and never blocks the protobuf and JS commit
      # below; otel.yaml's freshness check fails while otel/gen is stale.
      - name: Set up weaver
        continue-on-error: true
        uses: open-telemetry/weaver/.github/actions/setup-weaver@51a5bf95bdbb2e20fb6e16638e6bbe7dde911e93 # v0.28.0
        with:
          version: "0.28.0"

      - name: Generate the telemetry conventions
        continue-on-error: true
        run: go tool mage otel

      - name: Add changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: '["livekit", "replay", "rpc", "infra", "packages/javascript/src/gen", "otel/gen"]'
          default_author: github_actions
          message: generated protobuf
