# After a release PR merges: build, then tag both packages and create the
# GitHub release of @livekit/protocol, then publish to npm and the Go
# proxy. The step that cannot be undone comes last.
# The file name stays release.yaml: npm trusted publishing names it.
name: Release

on:
  # No `branches` filter: an rc PR from pre-release.yaml targets the branch
  # the workflow was run on. The condition on the first job decides which
  # PRs release.
  pull_request:
    types: [closed]
  # A failed job is re-run with "Re-run failed jobs" on the run itself:
  # that keeps the merge commit. This trigger is for a run that needs a
  # fixed workflow file from the branch. Anyone with write access can start
  # it. `verwalter release` resumes from the current state and skips what
  # is done.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or tag to build and publish. Set it to the release tag when the tag exists. Empty is the branch head.'
        type: string
        default: ''

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  # Before the tag: a commit that does not build is never tagged.
  build:
    # Only a release PR the tool opened: the branch prefix alone would let
    # any pushed `release/*` branch trigger a publish.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.user.login == 'verwalter-release[bot]' && contains(github.event.pull_request.body, '<!-- verwalter release -->'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a run by hand, `ref` is the released tag: the branch head can
          # hold newer source than the version that is published. `publish`
          # fails when the files changed since the tag.
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}

      # The published JS package is generated at build time, so protoc is a
      # release input. Keep it on the same release as generate.yaml, or the
      # published package is generated by a different compiler than the
      # committed Go code.
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @livekit/protocol run build

      # The bundle leaves its dependencies external, so a missing export
      # only fails when the published entry points are loaded.
      - name: Load the built package
        working-directory: packages/javascript
        run: |
          node --input-type=module -e "await import('./dist/index.mjs')"
          node -e "require('./dist/index.cjs')"

      # src/gen is generated, not committed, and the package ships it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript
          path: |
            packages/javascript/dist
            packages/javascript/src/gen
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit itself: a push to main right after the merge
          # must not move the tags.
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      - id: verwalter
        uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        with:
          command: release
          app-client-id: ${{ secrets.VERWALTER_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.VERWALTER_RELEASE_APP_KEY }}

  # Publishes the build job's output to npm and asks the Go proxy for the
  # tag. Skips a version a registry already has, so a re-run is safe.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One publish at a time, in arrival order. A waiting publish checks out
    # after the running one ends, so it sees the newer tag and picks the
    # right npm dist-tag.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # the tool flips the draft release after the publish
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0 # tags decide what is published
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No registry-url: with trusted publishing, its placeholder token
      # makes the publish fail with 404.
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: javascript
          path: packages/javascript
      - uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: publish
          releases: ${{ needs.release.outputs.releases }}

  # The end state, asserted: `status --check` fails when a tag is not on
  # the remote, the GitHub release is missing or still a draft, or npm or
  # the Go proxy does not have the version. A step that was skipped
  # without an error ends here.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # reads only. A draft release is visible only with write access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        with:
          command: status
          args: --check
